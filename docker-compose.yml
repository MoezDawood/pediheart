services:
  slicer:
    build: .
    image: pediheart-slicer:latest
    container_name: pediheart-slicer
    ports:
      - "${SLICER_PORT:-8501}:8501"
    environment:
      SLICER_DATA_DIR: /data
      SLICER_STATE_DIR: /state
    volumes:
      - ./data:/data
      - ./state:/state
    restart: unless-stopped
